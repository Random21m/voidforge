<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 72 72" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff00aa"/>
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
  </defs>
  <!-- Dice body with rounded corners and slight 3D feel -->
  <rect x="8" y="8" width="56" height="56" rx="10" fill="url(#face)" stroke="url(#grad)" stroke-width="2.5"/>
  <!-- Top highlight for 3D effect -->
  <rect x="8" y="8" width="56" height="8" rx="10" fill="#00f0ff" opacity="0.15"/>
  <!-- Dice pips (5-face style) -->
  <circle cx="22" cy="22" r="4.5" fill="#00f0ff"/>
  <circle cx="50" cy="22" r="4.5" fill="#00f0ff"/>
  <circle cx="36" cy="36" r="5" fill="#ff00aa"/>
  <circle cx="22" cy="50" r="4.5" fill="#00f0ff"/>
  <circle cx="50" cy="50" r="4.5" fill="#00f0ff"/>
  <!-- Subtle inner glow -->
  <rect x="12" y="12" width="48" height="48" rx="6" stroke="url(#grad)" stroke-width="0.5" opacity="0.3" fill="none"/>
</svg>
