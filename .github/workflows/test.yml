name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # The mutation suite is split into 8 shards that run side by side (GitHub stops any single job after 6 hours).
    # Every shard must pass, and together they run every mutation. Shard 0 also runs the unit and oracle tests.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - name: Unit and oracle tests (shard 0 only)
        if: matrix.shard == 0
        run: node tests/test.js && node tests/oracle.test.mjs
      - name: Mutation tests (shard ${{ matrix.shard }} of 8)
        run: MUT_SHARD=${{ matrix.shard }}/8 node tests/mutation.test.mjs
      - name: SHA256SUMS matches voidforge.html, and tests changed nothing
        run: |
          sha256sum -c SHA256SUMS
          test "$(python3 -c "import hashlib,base64,sys; h=hashlib.sha256(open('voidforge.html','rb').read()).digest(); print('b'+base64.b32encode(bytes([1,0x55,0x12,0x20])+h).decode().lower().rstrip('='))")" = "$(cat CID.txt)"
          git diff --exit-code HEAD -- voidforge.html SHA256SUMS CID.txt
